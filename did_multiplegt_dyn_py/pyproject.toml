[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "did_multiplegt_dyn"
version = "0.1.0"
description = "Python implementation of did_multiplegt_dyn (de Chaisemartin & D'Haultfoeuille)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyreadstat>=1.2",   # read .dta files
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["did_multiplegt_dyn*"]
